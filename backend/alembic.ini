# Alembic configuration.
#
# NOTE: this file is deliberately ASCII-only.
# Alembic reads this ini with `encoding="locale"`, which on a zh-CN Windows box
# is GBK -- UTF-8 Chinese comment bytes then raise UnicodeDecodeError before
# Alembic even starts. Keep comments here in English; the Chinese design notes
# live in migrations/env.py and docs/STORAGE.md (plain .py/.md files are read
# as UTF-8 and are safe).
#
# Also note there is NO sqlalchemy.url here on purpose: the URL comes from
# app.core.config (i.e. DATABASE_URL in backend/.env) via migrations/env.py.
# Migrations and the running service must share one source of truth, otherwise
# you eventually get "works in CLI, missing table at startup".
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Shanghai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
