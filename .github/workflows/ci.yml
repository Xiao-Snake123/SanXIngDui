name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        run: |
          cd backend
          python -m pytest tests/ -q

  frontend:
    name: 前端类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          cd frontend
          npm ci

      - name: 类型检查
        run: |
          cd frontend
          npm run typecheck

      - name: 单元测试
        run: |
          cd frontend
          npm test

      - name: 构建
        run: |
          cd frontend
          npm run build:only
