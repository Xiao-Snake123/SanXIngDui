# 生产部署的 nginx 配置：托管 SPA 并把 /agent 代理到后端。
#
# 两个关键点：
# 1. SPA 路由：未知路径回落到 index.html，否则刷新 /ai/scene 会 404；
# 2. SSE 透传：必须关闭 proxy_buffering 与 gzip，否则 /api/restore/stream
#    的事件会被攒在缓冲区里，表现为「进度条不动，最后一次性出现」。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 多智能体后端（含 SSE）
    location /agent/ {
        proxy_pass http://backend:8123/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关闭缓冲与压缩，否则事件不会逐帧到达
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 静态资源缓存（带 hash 的产物可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
